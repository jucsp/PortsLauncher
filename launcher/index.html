<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0912" />
    <meta
      name="description"
      content="PortsHub — lanzador unificado de ports de juegos a PC, Linux y Android."
    />
    <title>PortsHub</title>

    <!-- Preconexión a las CDN de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Chakra Petch (display) · DM Sans (texto) · JetBrains Mono (código) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <style>
      /* ---------------------------------------------------------------------
         Fallback local: si Google Fonts no carga (offline, CSP, bloqueo de
         red), estos alias resuelven contra las copias instaladas en el
         sistema. No tocan `--f-*` de app.css: solo añaden un relevo.
         --------------------------------------------------------------------- */
      @font-face {
        font-family: 'Chakra Petch Local';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: local('Chakra Petch'), local('ChakraPetch-Regular'),
          local('ChakraPetch-Medium'), local('ChakraPetch-SemiBold'),
          local('ChakraPetch-Bold');
      }
      @font-face {
        font-family: 'DM Sans Local';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: local('DM Sans'), local('DMSans-Regular'), local('DMSans-Medium'),
          local('DMSans-Bold');
      }
      @font-face {
        font-family: 'JetBrains Mono Local';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: local('JetBrains Mono'), local('JetBrainsMono-Regular'),
          local('JetBrainsMono-Medium'), local('JetBrainsMono-Bold');
      }
    </style>
  </head>

  <body>
    <div id="app"><nav id="side" aria-label="Principal"></nav><main id="main"></main></div>
    <nav class="bnav" id="bnav" aria-label="Principal móvil"></nav>
    <div id="layer"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p style="padding: 2rem; text-align: center">PortsHub necesita JavaScript para funcionar.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
